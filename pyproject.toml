[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pyproject-validator"
version = "0.1.0"
description = "Process executor (not only) for tests."
readme = "README.rst"
keywords = [ "pre-commit", "pyproject" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [ "packaging>=20.0", "tomli>=1.0.0; python_version<'3.11'" ]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.urls]
Source = "https://github.com/fizyk/pyproject-validator"
"Bug Tracker" = "https://github.com/fizyk/pyproject-validator/issues"
Changelog = "https://github.com/fizyk/pyproject-validator/blob/v0.1.0/CHANGES.rst"

[project.scripts]
check-python-version-consistency = "check_python_versions:main"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "towncrier==25.8.0",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "check_python_versions"
module-root = ""
source-include = [ "CHANGES.rst", "tests/**" ]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.mypy]
ignore_missing_imports = "False"
follow_imports = "silent"
disallow_subclassing_any = "True"
disallow_untyped_calls = "True"
disallow_untyped_defs = "True"
disallow_incomplete_defs = "True"
check_untyped_defs = "True"
disallow_untyped_decorators = "True"
warn_unused_ignores = "True"
warn_no_return = "True"
warn_return_any = "True"
warn_unreachable = "True"
allow_untyped_globals = "False"
allow_redefinition = "False"
implicit_reexport = "False"
strict_equality = "True"
pretty = "True"
no_implicit_optional = "True"
show_error_codes = "True"

[[tool.mypy.overrides]]
module = [ "tomli" ]
ignore_missing_imports = "True"

[tool.pytest.ini_options]
xfail_strict = "True"
filterwarnings = "error"

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "README.rst"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/fizyk/pyproject-validator/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "0.1.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/fizyk/pyproject-validator/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneus"
showcontent = false
